# Production-like compose for staging validation.
# NOT for use in Kubernetes production — use k8s manifests for that.
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
      target: runner
    container_name: electronic-store-api
    restart: always
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - electronic-store-network

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
      target: runner
    container_name: electronic-store-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
    env_file:
      - .env.production
    depends_on:
      - api
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - electronic-store-network

  nginx:
    image: nginx:1.27-alpine
    container_name: electronic-store-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/sites:/etc/nginx/sites-enabled:ro
      - ./infrastructure/ssl/certs:/etc/ssl/certs:ro
      - ./infrastructure/ssl/private:/etc/ssl/private:ro
    depends_on:
      - api
      - web
    networks:
      - electronic-store-network

networks:
  electronic-store-network:
    driver: bridge
